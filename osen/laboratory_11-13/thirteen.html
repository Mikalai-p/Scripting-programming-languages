<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            margin: 0 auto;
            max-width: 1440px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .wrapenter {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }

        input {
            padding: 5px 800px 5px 5px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        h1 {
            font-size: 48px;
            color: lightgreen;
        }

        .add, .add1 {
            padding: 20px;
            background-color: rgb(89, 151, 89);
            border: 0;
            color: white;
            border-radius: 5px;
        }

        .wrap1 {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li {
            border: 1px solid gray;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-title {
            flex-grow: 1;
            margin-left: 10px;
        }

        .edit-btn {
            padding: 10px;
            background-color: rgb(50, 102, 197);
            border: 0;
            color: white;
            border-radius: 5px;
            margin-left: 10px;
        }

        .delete-btn {
            padding: 10px;
            background-color: rgb(255, 69, 0);
            border: 0;
            color: white;
            border-radius: 5px;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Список дел</h1>
        <div class="wrapenter">
            <input type="text" id="taskTitle" placeholder="Введите название задачи">
            <button class="add" onclick="addTask()">Добавить</button>
        </div>

        <div>
            <div class="wrap1">
                <button class="add1" onclick="filterTasks('all')">Показать все</button>
                <button class="add1" onclick="filterTasks('completed')">Показать выполненные</button>
                <button class="add1" onclick="filterTasks('notCompleted')">Показать не выполненные</button>
            </div>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script src = "therteen.js"> </script>
</body>
</html>
