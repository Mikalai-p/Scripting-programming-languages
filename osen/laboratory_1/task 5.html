<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5 - Проверка имени преподавателя</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #2c3e50;
        }
        pre {
            background-color: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task 5 - Проверка имени преподавателя</h1>
        
        <button onclick="runTask()">Запустить задание</button>
        
        <script>
            function runTask() {
                const teacherName = "Шиман Дмитрий Васильевич";

                function normalizeString(str) {
                    return str.toLowerCase().trim().replace(/\s+/g, ' ');
                }

                const userInput = prompt("Введите имя преподавателя:");

                const normalizedInput = normalizeString(userInput);
                const normalizedTeacherName = normalizeString(teacherName);

                const allowedVariants = [
                    "дмитрий",
                    "дмитрий васильевич",
                    "шиман дмитрий васильевич"
                ];

                const isValid = allowedVariants.includes(normalizedInput);

                if (isValid) {
                    alert("Введенные данные верные");
                } else {
                    alert("Введенные данные не верные");
                }
            }
        </script>
    </div>
</body>
</html>
