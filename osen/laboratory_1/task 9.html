<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9 - Дни недели</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #2c3e50;
        }
        pre {
            background-color: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background-color: #e8f4f8;
            border-radius: 4px;
        }
        input {
            padding: 8px;
            width: 100px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task 9 - Дни недели</h1>

        <h2>Код задания:</h2>
        <div>
            <input type="number" id="dayNumber" min="1" max="7" placeholder="Введите число 1-7">
            <button onclick="runTask()">Запустить задание</button>
        </div>
        
        <div class="result" id="result"></div>
        
        <script>
            function runTask() {
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = '<h3>Результат:</h3>';
                
                const dayNumber = parseInt(document.getElementById('dayNumber').value);
                const weekDays = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];

                if (dayNumber >= 1 && dayNumber <= 7) {
                    const dayName = weekDays[dayNumber - 1];
                    const p = document.createElement('p');
                    p.textContent = `День недели: ${dayName}`;
                    resultDiv.appendChild(p);
                    
                    // Также выводим в консоль
                    console.log(`День недели: ${dayName}`);
                } else {
                    const p = document.createElement('p');
                    p.textContent = "Ошибка! Введите число от 1 до 7.";
                    resultDiv.appendChild(p);
                    
                    // Также выводим в консоль
                    console.log("Ошибка! Введите число от 1 до 7.");
                }
            }
        </script>
    </div>
</body>
</html>
