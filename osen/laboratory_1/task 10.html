<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 10 - Функция с параметрами</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #2c3e50;
        }
        pre {
            background-color: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background-color: #e8f4f8;
            border-radius: 4px;
        }
        input {
            padding: 8px;
            width: 200px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task 10 - Функция с параметрами</h1>
        
        <div>
            <input type="text" id="userInput" placeholder="Введите третий параметр">
            <button onclick="runTask()">Запустить задание</button>
        </div>
        
        <div class="result" id="result"></div>
        
        <script>
            function runTask() {
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = '<h3>Результаты:</h3>';
                
                const userInput = document.getElementById('userInput').value || "Пользовательский ввод";

                function combineParams(param1 = "Значение_по_умолчанию", param2, param3) {
                    return `${param1} ${param2} ${param3}`;
                }

                const result1 = combineParams("Первый", "Второй", userInput);
                const result2 = combineParams(undefined, "Второй", userInput);
                const result3 = combineParams(null, "Второй", userInput);
                
                const results = [
                    { name: "Все параметры передаются явно", value: result1 },
                    { name: "Первый параметр использует значение по умолчанию", value: result2 },
                    { name: "Первый параметр null", value: result3 }
                ];
                
                results.forEach(item => {
                    const p = document.createElement('p');
                    p.innerHTML = `<strong>${item.name}:</strong> ${item.value}`;
                    resultDiv.appendChild(p);
                    
                    // Также выводим в консоль
                    console.log(`${item.name}:`, item.value);
                });
            }
        </script>
    </div>
</body>
</html>
