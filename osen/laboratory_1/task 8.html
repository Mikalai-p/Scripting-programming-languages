<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8 - Генерация массива</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #2c3e50;
        }
        pre {
            background-color: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background-color: #e8f4f8;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task 8 - Генерация массива</h1>
        <button onclick="runTask()">Запустить задание</button>
        
        <div class="result" id="result"></div>
        
        <script>
            function runTask() {
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = '<h3>Результат:</h3>';
                
                const result = [];

                for (let i = 1; i <= 10; i++) {
                    if (i % 2 === 0) {
                        result.push(i + 2);
                    } else {
                        result.push(i + 'мм');
                    }
                }

                const p = document.createElement('p');
                p.textContent = JSON.stringify(result);
                resultDiv.appendChild(p);
                
                // Также выводим в консоль
                console.log("Результат:", result);
            }
        </script>
    </div>
</body>
</html>
